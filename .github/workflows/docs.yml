name: Docs

# Publish the rustdoc API reference to GitHub Pages on every push to main:
# https://oxihep.github.io/oxistats/ (redirects to the `oxistats` crate).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege needed to publish to Pages via the official deploy action.
permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deployment at a time; don't cancel a running publish.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  build:
    name: build API docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build rustdoc
        run: cargo doc --workspace --no-deps --all-features

      # The site root sends visitors to the main crate's page.
      - name: Add an index page
        run: |
          cat > target/doc/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>oxistats API docs</title>
          <meta http-equiv="refresh" content="0; url=oxistats/index.html">
          <link rel="canonical" href="oxistats/index.html">
          <a href="oxistats/index.html">oxistats API documentation</a>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/doc

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
